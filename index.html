<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="备用线路入口 - 请扫码获取最新可用地址">
<title>备用入口 · 请扫码访问</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .container {
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .logo { margin-bottom: 8px; }
  h1 {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 4px;
    color: #f1f5f9;
  }
  .subtitle {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 32px;
  }
  .qrcode-box {
    background: #1e293b;
    border-radius: 16px;
    padding: 32px;
    margin-bottom: 24px;
    border: 1px solid #334155;
  }
  .qrcode-box img {
    width: 200px;
    height: 200px;
    display: block;
    margin: 0 auto 16px;
    border-radius: 8px;
  }
  .qrcode-box .hint {
    font-size: 13px;
    color: #64748b;
  }
  .qrcode-placeholder {
    width: 200px; height: 200px;
    margin: 0 auto 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #334155;
    border-radius: 8px;
    color: #64748b;
    font-size: 14px;
  }
  .status-card {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    border: 1px solid #334155;
  }
  .status-card h3 {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .domain-list { list-style: none; }
  .domain-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #1e293b;
    font-size: 14px;
  }
  .domain-item:last-child { border-bottom: none; }
  .domain-name { color: #e2e8f0; font-family: monospace; }
  .status-badge {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 20px;
    font-weight: 500;
  }
  .status-badge.online { background: #065f46; color: #6ee7b7; }
  .status-badge.offline { background: #7f1d1d; color: #fca5a5; }
  .status-badge.checking { background: #1e3a5f; color: #93c5fd; }
  .status-badge.unknown { background: #374151; color: #9ca3af; }
  .footer {
    margin-top: 24px;
    font-size: 12px;
    color: #475569;
  }
  .footer a { color: #60a5fa; text-decoration: none; }
  @media (max-width: 480px) {
    .qrcode-box { padding: 24px; }
    .qrcode-box img, .qrcode-placeholder { width: 160px; height: 160px; }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <svg viewBox="0 0 48 48" width="48" height="48" xmlns="http://www.w3.org/2000/svg">
      <rect width="48" height="48" rx="8" fill="#111"/>
      <path d="M33.5 11.5c-1.1 0-2-.9-2-2h-3.5v18.3c0 3.8-3.1 7-6.9 7s-6.9-3.1-6.9-6.9 3.1-6.9 6.9-6.9c.7 0 1.4.1 2 .3v-3.6c-.7-.1-1.3-.2-2-.2-5.8 0-10.5 4.7-10.5 10.5S15.7 36.5 21.5 36.5 32 31.8 32 26V18c1.5 1.2 3.4 2 5.5 2v-4.5c-2.2 0-4.2-1.3-5.5-3.3L33.5 11.5h-.7z" fill="white"/>
      <path d="M33.5 11.5c-1.1 0-2-.9-2-2h-3.5v18.3c0 3.8-3.1 7-6.9 7s-6.9-3.1-6.9-6.9 3.1-6.9 6.9-6.9c.7 0 1.4.1 2 .3v-3.6c-.7-.1-1.3-.2-2-.2-5.8 0-10.5 4.7-10.5 10.5S15.7 36.5 21.5 36.5 32 31.8 32 26V18c1.5 1.2 3.4 2 5.5 2v-4.5c-2.2 0-4.2-1.3-5.5-3.3L33.5 11.5h-.7z" fill="#25f4ee" transform="translate(2.5,2.5)" opacity="0.7"/>
      <path d="M33.5 11.5c-1.1 0-2-.9-2-2h-3.5v18.3c0 3.8-3.1 7-6.9 7s-6.9-3.1-6.9-6.9 3.1-6.9 6.9-6.9c.7 0 1.4.1 2 .3v-3.6c-.7-.1-1.3-.2-2-.2-5.8 0-10.5 4.7-10.5 10.5S15.7 36.5 21.5 36.5 32 31.8 32 26V18c1.5 1.2 3.4 2 5.5 2v-4.5c-2.2 0-4.2-1.3-5.5-3.3L33.5 11.5h-.7z" fill="#ff004f" transform="translate(5,5)" opacity="0.7"/>
    </svg>
  </div>
  <h1>备用入口</h1>
  <p class="subtitle">扫码获取最新可用地址</p>

  <div class="qrcode-box">
    <div id="qrcode">
      <div class="qrcode-placeholder">生成二维码中...</div>
    </div>
    <p class="hint">扫一扫，自动跳转可用线路</p>
  </div>

  <div class="status-card">
    <h3>📡 当前线路状态</h3>
    <ul class="domain-list" id="domainList">
      <li class="domain-item">
        <span class="domain-name">m.skcloudtop.top</span>
        <span class="status-badge checking">检测中</span>
      </li>
    </ul>
  </div>

  <div class="footer">
    如果所有线路均不可用，请稍后再试或联系客服
  </div>
</div>

<script>
// ====== 配置区：在这里添加/删除备用域名 ======
const DOMAINS = [
  { name: 'm.skcloudtop.top', url: 'https://m.skcloudtop.top' },
  // 备用域名在这里加 ↓
  // { name: 'm2.xxx.com',   url: 'https://m2.xxx.com' },
  // { name: 'm3.xxx.com',   url: 'https://m3.xxx.com' },
];

const CHECK_TIMEOUT = 5000;

// ====== QR 码生成 ======
function generateQRFallback(text) {
  const box = document.getElementById('qrcode');
  // 先尝试 qrserver API
  let loaded = false;
  
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.alt = 'QR Code';
  img.style.cssText = 'width:200px;height:200px;border-radius:8px;display:block;margin:0 auto 16px;';
  
  img.onload = () => {
    box.innerHTML = '';
    box.appendChild(img);
    loaded = true;
  };
  
  img.onerror = () => {
    if (loaded) return;
    // 备用：用内嵌 SVG 二维码（通过 QR码在线API转换）
    box.innerHTML = `<div class="qrcode-placeholder" style="cursor:pointer" onclick="window.open('${text}','_blank')">
      ⬇️ 点击打开<br><span style="font-size:12px">${text}</span>
    </div>`;
  };
  
  const encoded = encodeURIComponent(text);
  img.src = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=${encoded}&margin=10`;
}

function updateQR(domain) {
  const url = domain.url || domain;
  generateQRFallback(url);
  const hint = document.getElementById('qrDomainHint');
  if (hint) hint.textContent = domain.name || domain;
}

// ====== 域名可用性检测 ======
// 使用 Image 加载而不是 fetch，避免 CORS/no-cors 问题
function pingDomain(url) {
  return new Promise((resolve) => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), CHECK_TIMEOUT);
    
    // 先用 fetch cors 方式试试
    fetch(url, { method: 'HEAD', mode: 'cors', signal: controller.signal })
      .then(r => { clearTimeout(timer); resolve(true); })
      .catch(() => {
        // cors 失败，试试图片探测
        clearTimeout(timer);
        const img = new Image();
        const t = setTimeout(() => { img.src = ''; resolve(false); }, CHECK_TIMEOUT);
        img.onload = () => { clearTimeout(t); resolve(true); };
        img.onerror = () => { clearTimeout(t); 
          // onerror 也可能是跨域限制，但图片能请求到说明网络可达
          resolve(true); 
        };
        // 用 favicon 探测（几乎所有站点都有）
        img.src = url + '/favicon.ico?' + Date.now();
      });
  });
}

function renderStatus(results) {
  const list = document.getElementById('domainList');
  list.innerHTML = '';
  results.forEach((r) => {
    const cls = r.status === 'online' ? 'online' : r.status === 'offline' ? 'offline' : r.status === 'unknown' ? 'unknown' : 'checking';
    const txt = r.status === 'online' ? '✅ 正常' : r.status === 'offline' ? '❌ 不可用' : r.status === 'unknown' ? '⚠️ 未知' : '⏳ 检测中';
    list.innerHTML += `
      <li class="domain-item">
        <span class="domain-name">${r.domain}</span>
        <span class="status-badge ${cls}">${txt}</span>
      </li>`;
  });
}

async function checkAllDomains() {
  const results = DOMAINS.map(d => ({ domain: d.name, status: 'checking' }));
  renderStatus(results);

  const checks = DOMAINS.map(async (d) => {
    try {
      const online = await pingDomain(d.url);
      const result = results.find(r => r.domain === d.name);
      if (result) result.status = online ? 'online' : 'offline';
      renderStatus(results);
      return { domain: d, online };
    } catch {
      const result = results.find(r => r.domain === d.name);
      if (result) result.status = 'offline';
      renderStatus(results);
      return { domain: d, online: false };
    }
  });

  const checkResults = await Promise.all(checks);
  const onlineDomains = checkResults.filter(r => r.online).map(r => r.domain);

  if (onlineDomains.length > 0) {
    updateQR(onlineDomains[0]);
  }
}

// ====== 初始化 ======
document.addEventListener('DOMContentLoaded', () => {
  updateQR(DOMAINS[0]);
  checkAllDomains();
  setInterval(checkAllDomains, 30000);
});
</script>
</body>
</html>
